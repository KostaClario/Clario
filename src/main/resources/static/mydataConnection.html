<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마이데이터 연동하기</title>
    <link rel="stylesheet" href="mydataconnection.css">
</head>
<body>

<div class="container">
    <h2>마이데이터 연동하기</h2>
    <div class="data-section">
        <div class="data-group">
            <label class="data-item"><input type="checkbox" checked>국민은행</label>
            <label class="data-item"><input type="checkbox" checked>기업은행</label>
            <label class="data-item"><input type="checkbox" checked>카카오뱅크</label>
            <label class="data-item"><input type="checkbox" checked>신한은행</label>
        </div>
        <div class="data-group">
            <label class="data-item"><input type="checkbox" checked>국민카드</label>
            <label class="data-item"><input type="checkbox" checked>기업카드</label>
            <label class="data-item"><input type="checkbox" checked>카카오뱅크카드</label>
            <label class="data-item"><input type="checkbox" checked>신한카드</label>
        </div>
    </div>
    <button>모두 불러오기</button>
</div>

</body>
</html>
