<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLARIO - 투명한 자산관리</title>
    <link rel="stylesheet" th:href="@{/css/login.css}" />
</head>
<body>
<div class="landing">
    <div class="logo">
        <img th:src="@{/img/ClarioPig.png}" alt="CLARIO Logo">
        <h2>CLARIO</h2>
        <p class="slogan">CLEAR INPUT OUT</p>
    </div>
    <h1>투명한 자산관리,<br>클라리오와 시작하세요.</h1>
    <p class="subtext">보이지 않던 지출까지<br>한눈에 정리해드립니다.</p>
    <a th:href="@{/oauth2/authorization/google}" class="google-login-btn">
        <img th:src="@{/img/Googlelogo.svg}" alt="Google Icon" />
        <span>Google 계정으로 시작하기</span>
    </a>
</div>
</body>
</html>
