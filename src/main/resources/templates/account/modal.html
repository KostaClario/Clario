<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>인증 모달</title>

    <!-- Axios CDN -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <!-- 공통 CSS -->
    <link rel="stylesheet" th:href="@{/account-css/modal.css}" />
    <link rel="stylesheet" th:href="@{/account-css/style.css}" />

</head>
<body>

<!-- 트리거 버튼 예시 -->
<button onclick="openPwInputModal()">비밀번호 입력 모달 열기</button>
<button onclick="openEmailModal()">이메일 인증 모달 열기</button>
<button onclick="openResetModal()">비밀번호재설정모달</button>

<!-- 1) 비밀번호 입력 모달 -->
<div id="pwInputModal" class="modal">
    <div class="modal-content">
        <span class="modal-close" onclick="closeModal('pwInputModal')">&times;</span>
        <h2 style="text-align:center;">비밀번호</h2>

        <div class="form-field" style="justify-content:center;">
            <input type="password" id="currentPassword" placeholder="PassWord" />
        </div>
        <div id="pwInputError" class="error-msg" style="display:none;">
            비밀번호가 올바르지 않습니다.
        </div>

        <div class="btn-group">
            <button class="btn btn-cancel" onclick="closeModal('pwInputModal')">취소</button>
            <button class="btn" onclick="validatePassword()">확인</button>
        </div>
        <div style="text-align:center; margin-top:8px;">
            <button class="btn-cancel" style="background:none; color:#ccc; border:none; cursor: pointer"
                    onclick="openEmailModalFromPwInput()">
                비밀번호 재설정
            </button>
        </div>
    </div>
</div>

<!-- 2) 이메일 인증 모달 -->
<div id="emailModal" class="modal" data-email="">
    <div class="modal-content">
        <span class="modal-close" onclick="closeModal('emailModal')">&times;</span>
        <h2 style="text-align:center;">이메일 인증</h2>

        <!-- 이메일 입력 -->
        <div class="form-field">
            <input type="text" id="emailLocal" name="emailLocal" placeholder="이메일 앞부분" autocomplete="off" />
            <span>@</span>
            <select id="emailDomain" name="emailDomain">
                <option value="gmail.com">gmail.com</option>
                <option value="naver.com">naver.com</option>
                <option value="daum.net">daum.net</option>
            </select>
        </div>

        <div class="btn-group">
            <button class="btn" onclick="sendVerificationEmail()">인증</button>
        </div>

        <!-- 코드 입력 -->
        <div class="form-field" style="margin-top:16px;">
            <input type="text" id="emailCode" name="emailCode" placeholder="인증 코드 입력" autocomplete="off" />
        </div>
        <div id="emailError" class="error-msg" style="display:none;">
            인증에 실패했습니다.
        </div>

        <div class="btn-group">
            <button class="btn btn-cancel" onclick="closeModal('emailModal')">취소</button>
            <button class="btn" onclick="verifyEmailCode()">확인</button>
        </div>
    </div>
</div>


<!-- 3) 비밀번호 재설정 모달 -->
<div id="resetModal" class="modal">
    <div class="modal-content">
        <span class="modal-close" onclick="closeModal('resetModal')">&times;</span>
        <h2 style="text-align:center;">비밀번호 재설정</h2>

        <div class="form-field">
            <label>새 비밀번호</label>
            <input type="password" id="newPassword" placeholder="******" />
        </div>
        <div class="form-field">
            <label>비밀번호 확인</label>
            <input type="password" id="confirmNewPassword" placeholder="******" />
        </div>
        <div id="resetError" class="error-msg" style="display:none;">
            비밀번호가 일치하지 않습니다.
        </div>

        <div class="btn-group">
            <button class="btn btn-cancel" onclick="closeModal('resetModal')">취소</button>
            <button class="btn" onclick="changePassword()">변경</button>
        </div>
    </div>
</div>

<script>
    // 공통 열기/닫기
    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    function openEmailModalFromPwInput(){
        closeModal('pwInputModal');
        openModal('emailModal');
    }

    function openPwInputModal()    { openModal('pwInputModal'); }
    function openEmailModal()      { openModal('emailModal'); }
    function openResetModal()      { openModal('resetModal'); }

    // 1) 현재 비밀번호 검증
    function validatePassword() {
        const password = document.getElementById('currentPassword').value;
        const errorDiv = document.getElementById("pwInputError");
        errorDiv.style.display = 'none';  // 에러 초기화

        axios.post('/account/verify-password',
            { password: password }, // 바디 내용은 JSON 객체
            {
                headers: {
                    'Content-Type': 'application/json'
                }
            }
        )
            .then(res => {
                window.location.href = "/account/edit";
            })
            .catch(err => {
                errorDiv.style.display = 'block';
                console.error("비밀번호 검증 실패 : ", err);
            });
    }

    // 이메일 발송
    function sendVerificationEmail() {
        const local = document.getElementById('emailLocal').value.trim();
        const domain = document.getElementById('emailDomain').value;
        const email = `${local}@${domain}`;

        if (!local) {
            alert("이메일 앞부분을 입력해주세요.");
            return;
        }

        axios.post('/api/send-code', { email })
            .then(() => {
                alert('인증 코드가 발송되었습니다.');
                // 이메일 모달 요소에 이메일을 저장
                document.getElementById('emailModal').setAttribute('data-email', email);
            })
            .catch(() => {
                alert('이메일 발송 실패');
            });
    }

    // 검증
    function verifyEmailCode() {
        const code = document.getElementById('emailCode').value.trim();
        const email = document.getElementById('emailModal').getAttribute('data-email');
        const errorDiv = document.getElementById('emailError');

        errorDiv.style.display = 'none';

        if (!code) {
            errorDiv.textContent = "인증 코드를 입력해주세요.";
            errorDiv.style.display = 'block';
            return;
        }

        axios.post('/api/verify-code', { email, code })
            .then(res => {
                if (res.data.verified) {
                    closeModal('emailModal');
                    openResetModal();
                    alert("인증이 완료되었습니다.");
                } else {
                    throw new Error("코드 불일치");
                }
            })
            .catch(() => {
                errorDiv.textContent = "인증에 실패했습니다.";
                errorDiv.style.display = 'block';
            });
    }


    // 3) 비밀번호 변경
    function changePassword() {
        const newPassword = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmNewPassword').value;
        const errorDiv = document.getElementById('resetError');

        if (newPassword !== confirmPassword) {
            errorDiv.textContent = '비밀번호가 일치하지 않습니다.';
            return errorDiv.style.display = 'block';
        }

        axios.post('/account/reset-password',
            JSON.stringify({ newPassword: newPassword, confirmPassword: confirmPassword }),
            {
                headers: {
                    'Content-Type': 'application/json'
                }
            }
        )
            .then(_ => {
                alert('비밀번호가 변경되었습니다.');
                closeModal('resetModal');
            })
            .catch(err => {
                console.error("비밀번호 변경 오류:", err);
                errorDiv.textContent = '변경 중 오류가 발생했습니다.';
                errorDiv.style.display = 'block';
            });
    }
</script>
</body>
</html>
