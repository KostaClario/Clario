<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>개인정보 수정</title>

    <!-- 아이콘 폰트 & 구글 폰트 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR&display=swap" rel="stylesheet"/>

    <link rel="stylesheet" th:href="@{/account-css/style.css}" />
</head>
<body>

    <main class="container">
        <section class="content">
            <div class="profile-icon" style="text-align:center; margin-bottom:24px;">
                <i class="bi bi-person-circle" style="font-size:4rem; color:#6750A4;"></i>
            </div>

            <!-- 타임리프 form -->
            <form th:action="@{/account/edit}" th:object="${updateForm}" method="post" class="form-edit">

                <!-- 이메일 (읽기 전용) -->
                <div class="form-field" style="margin-bottom:16px; text-align:center;">
                    <input type="email" th:field="*{email}" readonly />
                </div>

                <!-- 이름 (수정 가능) -->
                <div class="form-field" style="margin-bottom:16px; text-align:center;">
                    <input type="text" th:field="*{name}" placeholder="이름" required />
                </div>

                <!-- 휴대폰 번호 (수정 가능) -->
                <div class="form-field" style="margin-bottom:16px; text-align:center;">
                    <input type="text" th:field="*{phonenum}" placeholder="휴대폰 번호" required />
                </div>

                <!-- 새 비밀번호 -->
                <div class="form-field" style="margin:12px 0 4px; text-align:center;">
                    <input type="password" th:field="*{password}"
                           placeholder="새 비밀번호 (영문·숫자·특수문자 8~16자)"
                           minlength="8" maxlength="16" />
                </div>

                <!-- 비밀번호 확인 -->
                <div class="form-field" style="margin:12px 0 4px; text-align:center;">
                    <input type="password" th:field="*{confirmPassword}" placeholder="새 비밀번호 확인" />
                    <div th:if="${error}" th:text="${error}" style="color:red;"></div>
                </div>

                <!-- 버튼 -->
                <div class="btn-group" style="margin-top:32px; text-align:center;">
                    <button type="button" class="btn btn-cancel" th:onclick="|window.location.href='@{/mypage}'|">취소</button>
                    <button type="submit" class="btn btn-quit">수정 완료</button>
                </div>
            </form>

        </section>
    </main>
</div>

<script>
    // JS 코드 추가 가능
</script>
</body>
</html>
