<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CLARIO 대시보드</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/bar.css}"/>
    <link rel="stylesheet" th:href="@{/css/dashboard.css}"/>
<!--    <link rel="stylesheet" href="/css/dashboard.css" />-->
<!--    <link rel="stylesheet" th:href="@{/css/style.css}" />-->
    <script th:src="@{/js/dashboard.js}" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.anychart.com/releases/8.11.0/js/anychart-bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>

<!-- 사이드바 -->
<aside th:fragment="sidebar" class="sidebar">
    <div class="logo">
        <img src="/img/ClarioLogoTextOnly.png" alt="CLARIO Logo">
    </div>
    <ul class="menu">
        <li><a class="nav-icon active" href="/dashboard">🏠</a></li>
        <li><a class="nav-icon" href="/statistics">📈</a></li>
        <li><a class="nav-icon" href="/history">☰</a></li>
        <li><a class="nav-icon" href="/card">💳</a></li>
    </ul>
</aside>

<!-- 상단바-->
<header th:fragment="header" class="topbar">
    <div class="topbar-center" id="currentDate">날짜 로딩 중…</div>

    <div class="topbar-right">
        <span class="user-name" th:if="${name != null}" th:text="${name} + '님'">사용자님</span>
        <input type="hidden" id="memberId" th:value="${memberId}" />
        <span th:unless="${name != null}">로그인 사용자</span>

        <!-- 로그아웃 -->
        <form th:action="@{/logout}" method="post" id="logoutForm">
            <button type="button" class="logout-btn"
                    onclick="document.getElementById('logoutForm').submit();">로그아웃</button>
        </form>

        <!-- 프로필 사진 + 드롭다운 -->
        <div class="profile-container" onclick="this.classList.toggle('hover')">
            <button class="profile-btn">
                <img th:if="${profile != null}" th:src="${profile}" alt="프로필" class="profile-img" />
                <i th:if="${profile == null}" class="bi user-avatar"></i>
            </button>
            <div class="profile-menu">
                <button type="button" class="profile-menu-item"
                        th:onclick="|window.location.href='@{/mydata/mybankandcardlist}'|">
                    자산 조회
                </button>
                <button type="button" class="profile-menu-item"
                        th:onclick="|window.location.href='@{/account/edit}'|">
                    정보 수정
                </button>
            </div>
        </div>
    </div>
</header>

<main class="main">
    <div class="content">
        <div class="dashboard">
            <div class="income card">
                <h3>이번달 수입</h3>
                <h2 class="blue" id="montylyIncome">5,122,000원</h2>
            </div>
            <div class="expense card">
                <h3>이번달 소비</h3>
                <h2 class="red" id="montylyExpense">1,422,000원</h2>
            </div>
            <div class="ratio card">
                <h3>이번달 수입 대비 소비</h3>
                <canvas id="incomeSpendingChart"></canvas>
            </div>

            <div class="goal card">
                <h3>자산목표 대비 총자산</h3>
                <p id="no-goal-message" style="display: none;">🎯 목표자산을 설정해주세요!</p>
                <div id="goal-chart-container" style="display: none;">
                    <canvas id="goalChart" width="300" height="300"></canvas>
                    <p id="goal-details"></p>
                </div>
                <button id="goal-button">자산목표 설정하기</button>
            </div>
            <!-- 자산 목표 설정 모달-->
            <div class="modal-overlay" id="goal-modal">
                <div class="modal-content">
                    <h3>자산 목표 설정</h3>
                    <div class="row">
                        <label for="goalInput">총자산</label>
                        <h3 class="totalBalance">총자산 로딩</h3>
                    </div>
                    <div class="row">
                        <label for="goalInput">자산목표</label>
                        <div class="input-group">
                            <input type="text" id="goalInput" name="goalInput" placeholder="목표금액을 입력해주세요." />
                            <span>원</span>
                        </div>
                    </div>

                    <div class="button-group">
                        <button class="modal-button" id="close-modal">닫기</button>
                        <button class="modal-button" id="save-goal-btn">확인</button>
                    </div>
                </div>
            </div>


            <div class="daily card2">
                <h3 id="today-date2" class="card-title" >오늘의 수입 및 소비</h3>
                <div class="daily-box ">
                    <div class="record plus">
                        <p class="record-icon">+</p>
                        <div id="income-column" class="record-column"></div>
                    </div>
                    <div class="record minus">
                        <p class="record-icon">-</p>
                        <div id="expense-column" class="record-column"></div>
                    </div>
                </div>
            </div>
            <div class="category card">
                <h3><span id="topCategoryMonth">--</span> 상위 카테고리</h3>
                <canvas id="top3PieChart" width="250" height="250"></canvas>
            </div>
            <div class="graph card2">
                <h3><span id="currentYear">----</span>년 월별 수입 & 소비 추이</h3>
                <canvas id="monthlyLineChart" width="950" height="290"></canvas>
            </div>
        </div>
    </div>
</main>

<!--<script src="js/chart-script.js" defer></script>-->
<script th:inline="javascript">
    const today = new Date();
    const days = ['일', '월', '화', '수', '목', '금', '토'];

    const year    = today.getFullYear();
    const month   = String(today.getMonth() + 1).padStart(2, '0');
    const date    = String(today.getDate()).padStart(2, '0');
    const weekday = days[today.getDay()];

    const formatted = `${year}. ${month}. ${date}. (${weekday})`;

    const el = document.getElementById('currentDate');
    if (el) {
        el.textContent = formatted;
    }

    // 로그아웃 핸들러
    document.querySelector('.logout-btn').addEventListener('click', () => {
        if (confirm('로그아웃 하시겠습니까?')) {
            alert('로그아웃 되었습니다.');
        }
    });
</script>
</body>
</html>
