<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>헤더와 사이드바</title>
</head>
<body>

<!-- ✅ 모달은 사이드바 밖 또는 맨 위에 배치 -->
<div id="pwInputModal" class="modal" style="display:none;">
    <div class="modal-content">
        <span class="modal-close" onclick="closeModal('pwInputModal')">&times;</span>
        <h2 style="text-align:center;">비밀번호</h2>

        <div class="form-field" style="justify-content:center;">
            <input type="password" id="currentPassword" placeholder="Password" />
        </div>
        <div id="pwInputError" class="error-msg" style="display:none;">
            비밀번호가 올바르지 않습니다.
        </div>

        <div class="btn-group">
            <button class="btn btn-cancel" onclick="closeModal('pwInputModal')">취소</button>
            <button class="btn" onclick="validatePassword()">확인</button>
        </div>
        <div style="text-align:center; margin-top:8px;">
            <button class="btn-cancel" style="background:none; color:#ccc; border:none; cursor: pointer"
                    onclick="openEmailModalFromPwInput()">
                비밀번호 재설정
            </button>
        </div>
    </div>
</div>

<!-- ✅ 사이드바 Fragment -->
<aside th:fragment="sidebar" class="sidebar">
    <div class="logo">
        <img src="/img/ClarioLogoTextOnly.png" alt="CLARIO Logo">
    </div>
    <ul class="menu">
        <li>
            <button class="menu-btn" onclick="confirmNavigation('/dashboard')">
                <i class="bi bi-house-door"></i>
            </button>
        </li>
        <li>
            <button class="menu-btn" onclick="confirmNavigation('/view/statistics')">
                <i class="bi bi-graph-up"></i>
            </button>
        </li>
        <li>
            <button class="menu-btn" onclick="confirmNavigation('/history')">
                <i class="bi bi-list-task"></i>
            </button>
        </li>
        <li>
            <button class="menu-btn" onclick="confirmNavigation('/cards')">
                <i class="bi bi-credit-card"></i>
            </button>
        </li>
    </ul>
</aside>

<!-- ✅ 상단바 Fragment -->
<header th:fragment="header" class="topbar">
    <div class="topbar-center" id="today-date">날짜 로딩 중…</div>

    <div class="topbar-right">
        <span th:if="${name != null}" th:text="${name} + '님'">사용자님</span>
        <span th:unless="${name != null}">로그인 사용자</span>

        <!-- 로그아웃 -->
        <form th:action="@{/logout}" method="post" id="logoutForm">
            <button type="button" class="logout-btn"
                    onclick="document.getElementById('logoutForm').submit();">로그아웃</button>
        </form>

        <!-- 프로필 사진 + 드롭다운 -->
        <div class="profile-container" onclick="this.classList.toggle('hover')">
            <button class="profile-btn">
                <img th:if="${profile != null}" th:src="${profile}" alt="프로필" class="profile-img" />
                <i th:if="${profile == null}" class="bi bi-person"></i>
            </button>
            <div class="profile-menu">
                <button type="button" class="profile-menu-item" onclick="confirmNavigation('/mydata/mybankandcardlist')">
                    자산 조회
                </button>
                <button type="button" class="profile-menu-item" onclick="confirmNavigation('/account/edit')">
                    정보 수정
                </button>
            </div>
        </div>
    </div>

    <!-- 날짜 표시 및 모달 스크립트 -->
    <script th:inline="javascript">
        const today = new Date();
        const days = ['일', '월', '화', '수', '목', '금', '토'];
        const formatted = `${today.getFullYear()}/${today.getMonth() + 1}/${today.getDate()}/${days[today.getDay()]}`;
        document.getElementById("today-date").textContent = formatted;

        function openEmailModalFromPwInput() {
            alert("비밀번호 재설정은 아직 구현되지 않았습니다.");
        }

        let pendingUrl = null;
        function confirmNavigation(url) {
            pendingUrl = url;
            document.getElementById('pwInputModal').style.display = 'block';
        }

        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
            pendingUrl = null;
        }

        function validatePassword() {
            const pw = document.getElementById("currentPassword").value;

            // 테스트용 비밀번호 로직
            if (pw === "1234") {
                document.getElementById('pwInputModal').style.display = 'none';
                if (pendingUrl) {
                    window.location.href = pendingUrl;
                }
            } else {
                document.getElementById("pwInputError").style.display = "block";
            }
        }
    </script>
</header>

</body>
</html>
