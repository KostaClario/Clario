<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 계좌 및 카드</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />
    <link rel="stylesheet" th:href="@{/css/myBankAndCardList.css}" />
</head>
<body>
<div class="wrapper">
    <aside class="sidebar">
        <div class="logo">CLARIO</div>
        <ul class="menu">
            <li>
                <button class="menu-btn" onclick="goTo('home')"><i class="bi bi-house-door"></i></button>
            </li>
            <li>
                <button class="menu-btn" onclick="goTo('stats')"><i class="bi bi-graph-up"></i></button>
            </li>
            <li>
                <button class="menu-btn" onclick="goTo('tasks')"><i class="bi bi-list-task"></i></button>
            </li>
            <li>
                <button class="menu-btn" onclick="goTo('cards')"><i class="bi bi-credit-card"></i></button>
            </li>
        </ul>
    </aside>
    <div class="main">
        <header class="topbar">
            <div class="topbar-center" id="today-date">날짜 로딩 중...</div>
            <div class="topbar-right">
                <span th:text="${name} + '님'">사용자님</span>
                <button class="logout-btn" onclick="logout()">로그아웃</button>
                <button class="profile-btn" onclick="openProfile()">
                    <i class="bi bi-person"></i>
                </button>
            </div>
        </header>
        <main class="content">
            <section class="section">
                <div class="section-inner">
                    <h3>내 계좌</h3>
                    <table class="data-table">
                        <thead>
                        <tr>
                            <th>계좌명</th>
                            <th>은행</th>
                            <th>계좌번호</th>
                            <th>금액</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="bank : ${banks}">
                            <td th:text="${bank.bankAccountName}">계좌명</td>
                            <td th:text="${bank.bankName}">은행</td>
                            <td th:text="${bank.bankAccountNum}">계좌번호</td>
                            <td th:text="${T(java.lang.String).format('%,d', bank.balance.longValue())}">금액</td>
                        </tr>
                        <tr th:if="${banks.empty}">
                            <td colspan="4">등록된 은행 계좌가 없습니다.</td>
                        </tr>
                        </tbody>
                    </table>
                    <div class="pagination">
                        <!-- 페이지 네비게이션: 필요시 서버에서 pageNumbers 모델로 전달 -->
                        <a th:each="pageNum : ${pageNumbers}" th:href="@{/myDataConnection/{memberId}(memberId=${memberId}) + '?page=' + ${pageNum}}" th:text="${pageNum}" th:classappend="${pageNum == currentPage} ? 'active' : ''">1</a>
                    </div>
                </div>
            </section>

            <section class="section">
                <div class="section-inner">
                    <h3>내 카드</h3>
                    <table class="data-table">
                        <thead>
                        <tr>
                            <th>카드이름</th>
                            <th>카드사</th>
                            <th>납부계좌</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="card : ${cards}">
                            <td th:text="${card.cardName}">카드이름</td>
                            <td th:text="${card.cardCompany}">카드사</td>
                            <td th:text="${#strings.concat(card.cardBank, ' ', card.cardBankAccount)}">은행 계좌번호</td>
                        </tr>
                        <tr th:if="${cards.empty}">
                            <td colspan="3">등록된 카드 정보가 없습니다.</td>
                        </tr>
                        </tbody>
                    </table>
                    <div class="pagination">
                        <a th:each="pageNum : ${cardPageNumbers}" th:href="@{/myDataConnection/{memberId}(memberId=${memberId}) + '?cardPage=' + ${pageNum}}" th:text="${pageNum}" th:classappend="${pageNum == currentCardPage} ? 'active' : ''">1</a>
                    </div>
                </div>
            </section>
        </main>
    </div>
</div>
<!-- 날짜 및 사용자 JS -->
<script>
    const today = new Date();
    const days = ['일', '월', '화', '수', '목', '금', '토'];
    const formatted = `${today.getFullYear()}/${today.getMonth() + 1}/${today.getDate()}/${days[today.getDay()]}`;
    document.getElementById("today-date").textContent = formatted;
</script>
</body>
</html>
