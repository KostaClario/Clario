<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>개인정보 수정</title>

    <!-- 아이콘 폰트 & 구글 폰트 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
          rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR&display=swap"
          rel="stylesheet"/>


    <link rel="stylesheet" th:href="@{/account-css/style.css}" />
</head>
<body>
<header th:replace="~{headerside :: header}"></header>

<div class="layout">

    <aside th:replace="~{headerside :: sidebar}"></aside>

<main class="container">
    <section class="content">
        <div class="profile-icon" style="text-align:center; margin-bottom:24px;">
            <i class="bi bi-person-circle" style="font-size:4rem; color:#6750A4;"></i>
        </div>

        <!-- 표준 HTML form -->
        <form action="#" method="post" class="form-edit">
            <div class="form-field" style="margin-bottom:16px; text-align:center;">
                <input type="text" name="name" placeholder="이름" disabled/>
            </div>
            <div class="form-field" style="margin-bottom:16px; text-align:center;">
                <input type="text" name="phone" placeholder="010-0000-0000" disabled/>
            </div>
            <div class="form-field" style="margin-bottom:16px; text-align:center;">
                <input type="email" name="email" placeholder="user@example.com" disabled/>
            </div>
            <div class="form-field" style="margin:12px 0 4px; text-align:center;">
                <input type="password" name="newPassword"
                       placeholder="새 비밀번호 (영문·숫자·특수문자 8~16자)"
                       minlength="8" maxlength="16"/>
            </div>
            <div class="form-field" style="margin:12px 0 4px; text-align:center;">
                <input type="password" name="confirmPassword" placeholder="새 비밀번호 확인"/>
            </div>

            <div class="btn-group" style="margin-top:32px; text-align:center;">
                <button type="button" class="btn btn-cancel">취소</button>
                <button type="submit" class="btn btn-quit">수정 완료</button>
            </div>
        </form>
    </section>
</main>

<script>
    // 날짜 스크립트 등…
</script>
</body>
</html>
