<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>CLARIO 대시보드</title>

    <!-- CSS 파일들 -->
    <link rel="stylesheet" href="/account-css/bar.css"/>
    <link rel="stylesheet" href="/account-css/style.css"/>
    <link rel="stylesheet" href="/account-css/modal.css"/>
</head>
<body>

<!-- ✅ 사이드바 Fragment -->
<aside th:fragment="sidebar" class="sidebar">
    <div class="logo">
        <img src="/img/ClarioLogoTextOnly.png" alt="CLARIO Logo">
    </div>
    <ul class="menu">
        <li><button class="menu-btn" onclick="goTo('home')"><i class="bi bi-house-door"></i></button></li>
        <li><button class="menu-btn" onclick="goTo('stats')"><i class="bi bi-graph-up"></i></button></li>
        <li><button class="menu-btn" onclick="goTo('tasks')"><i class="bi bi-list-task"></i></button></li>
        <li><button class="menu-btn" onclick="goTo('cards')"><i class="bi bi-credit-card"></i></button></li>
    </ul>
</aside>

<!-- ✅ 상단바 Fragment -->
<header th:fragment="header (memberId, name)" class="topbar">
    <div class="topbar-center" id="today-date">날짜 로딩 중…</div>
    <div class="topbar-right">
        <span th:text="${name} + '님'">사용자님</span>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="logout-btn">로그아웃</button>
        </form>
        <!-- 프로필 버튼 + 드롭다운 -->
        <div class="profile-container">
            <button class="profile-btn">
                <i class="bi bi-person"></i>
            </button>
            <div class="profile-menu">
                <button type="button"
                        class="profile-menu-item"
                        th:onclick="|window.location.href='@{/myData/mybankandcardlist/{memberId}(memberId=${memberId})}'|">
                    내 자산
                </button>
                <button type="button" class="profile-menu-item" id="profileBtn">프로필</button>
            </div>
        </div>
    </div>

    <!-- 오늘 날짜 표시 스크립트 -->
    <script>
        const today = new Date();
        const days = ['일', '월', '화', '수', '목', '금', '토'];
        const formatted = `${today.getFullYear()}/${today.getMonth() + 1}/${today.getDate()}/${days[today.getDay()]}`;
        document.getElementById("today-date").textContent = formatted;
    </script>
</header>

<!-- ✅ modal.html에 정의된 모달 fragment 삽입 -->
<div th:replace="account/modal :: allModals"></div>

<!-- ✅ 모달 동작용 JS 불러오기 -->
<script src="/js/modal.js"></script>

<script>
    window.addEventListener('DOMContentLoaded', function () {
        const profileBtn = document.getElementById('profileBtn');
        if (profileBtn) {
            profileBtn.addEventListener('click', function () {
                openPwInputModal(); // modal.js에 있는 함수
            });
        }
    });
</script>

</body>
</html>
