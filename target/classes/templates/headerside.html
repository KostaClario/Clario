<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>CLARIO 대시보드</title>
    <link rel="stylesheet" th:href="@{/css/bar.css}"/>
</head>
<body>
<!-- 사이드바 Fragment -->
<aside th:fragment="sidebar" class="sidebar">
    <div class="logo">
        <img src="/img/ClarioLogoTextOnly.png" alt="CLARIO Logo">
    </div>
    <ul class="menu">
        <li>
            <button class="menu-btn" onclick="goTo('home')"><i class="bi bi-house-door"></i></button>
        </li>
        <li>
            <button class="menu-btn" onclick="goTo('stats')"><i class="bi bi-graph-up"></i></button>
        </li>
        <li>
            <button class="menu-btn" onclick="goTo('tasks')"><i class="bi bi-list-task"></i></button>
        </li>
        <li>
            <button class="menu-btn" onclick="goTo('cards')"><i class="bi bi-credit-card"></i></button>
        </li>
    </ul>
</aside>

<!-- 상단바 Fragment -->
<header th:fragment="header (memberId, name, user)" class="topbar">
    <div class="topbar-center" id="today-date">날짜 로딩 중…</div>
    <div class="topbar-right">
        <span th:text="${name} + '님'">사용자님</span>

        <!-- 로그아웃 -->
        <form th:action="@{/logout}" method="post" id="logoutForm">
            <button
                    type="button" class="logout-btn"
                    onclick="document.getElementById('logoutForm').submit();">
                로그아웃
            </button>
        </form>

        <!-- 프로필 사진 + 드롭다운 -->
        <div class="profile-container" onclick="this.classList.toggle('hover')">
            <button class="profile-btn">
                <!-- 구글 프로필 사진이 있으면 img, 없으면 기본 아이콘 -->
                <img th:if="${user.photo != null}"
                     th:src="${user.photo}"
                     alt="프로필 사진"
                     class="profile-img"/>
                <i th:if="${user.photo == null}" class="bi bi-person"></i>
            </button>
            <div class="profile-menu">
                <button type="button" class="profile-menu-item"
                        th:onclick="|window.location.href='@{/mydata/mybankandcardlist}'|">
                    자산 조회
                </button>
                <button type="button"
                        class="profile-menu-item"
                        th:onclick="|window.location.href='@{/account/edit}'|">
                    정보 수정
                </button>
            </div>
        </div>
    </div>
    <script>
        const today = new Date();
        const days = ['일', '월', '화', '수', '목', '금', '토'];
        const formatted = `${today.getFullYear()}/${today.getMonth() + 1}/${today.getDate()}/${days[today.getDay()]}`;
        document.getElementById("today-date").textContent = formatted;
    </script>
</header>
</body>
</html>
